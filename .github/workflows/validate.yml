name: Manual Ubuntu validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npm audit --audit-level=high
      - name: Install pinned Codex in an isolated runner prefix
        run: |
          npm install --prefix "$RUNNER_TEMP/codex" --ignore-scripts --no-audit --no-fund @openai/codex@0.162.1
          echo "$RUNNER_TEMP/codex/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Native CLI probes with local mock provider (no model calls)
        run: |
          mkdir -p artifacts/native
          node scripts/capture-native.mjs artifacts/native/success
          node scripts/capture-native.mjs artifacts/native/failure --fail-provider
          node scripts/capture-native.mjs artifacts/native/tool-success --tool-success
          node scripts/capture-native.mjs artifacts/native/tool-failure --tool-failure
      - name: Install Chromium for this runner only
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain synthetic screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-review
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain synthetic native probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-native-review
          path: artifacts/native/
          if-no-files-found: ignore
          retention-days: 7
